<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iris · 衣橱灵感库</title><meta name="description" content="把喜欢的穿搭变成自己的衣橱：筛选灵感、记录单品、规划购买与实穿。"><link rel="stylesheet" href="style.css?v=20261105-tryon"></head><body>
<aside><a class="brand" href="#">I<span>／</span></a><div class="brandname">IRIS WARDROBE<span>私人的穿搭编辑室</span></div><nav id="nav"></nav><div class="sidebottom"><p>从喜欢，到适合自己。</p><small>原图用来核对细节，效果图用来理解搭配。</small><button id="backup">↓ 导出管理备份</button><button id="restore">↑ 导入管理备份</button><small class="storage">修改保存在当前浏览器。换设备前请导出备份。</small></div></aside>
<main><header><span class="eyebrow">THE PERSONAL EDIT / 01</span><div class="headrow"><div><h1>把灵感，穿进生活。</h1><p>收藏喜欢的搭配，找到真正值得进入衣橱的单品。</p></div><button class="primary" id="add">＋ 添加穿搭</button></div><div class="stats" id="stats"></div></header>
<section class="workspace"><div class="sectionhead"><div><h2 id="sectionTitle">全部穿搭</h2><span id="resultCount"></span></div><div class="actions"><button id="favorites">♡ 只看收藏</button><select id="sort" aria-label="排序"><option value="default">默认顺序</option><option value="priority">优先级排序</option><option value="title">名称排序</option></select></div></div>
<div class="filterbar"><input id="search" placeholder="搜索名称、单品或笔记…" aria-label="搜索穿搭"><select id="scene" aria-label="场景"><option value="">全部场景</option></select><select id="weather" aria-label="厚薄"><option value="">全部厚薄</option></select><select id="pieces" aria-label="单品"><option value="">全部单品</option></select><select id="color" aria-label="配色"><option value="">全部配色</option></select><button id="more">更多筛选 ＋</button><button id="clear">重置</button></div><div class="filterbar extra" id="extra" hidden><select id="shape" aria-label="版型"><option value="">全部版型</option></select><select id="focus" aria-label="喜欢重点"><option value="">全部喜欢重点</option></select><select id="priority" aria-label="优先级"><option value="">全部优先级</option></select></div>
<p class="scope" id="scope">已收录当前可取得的图片，并非跨天对话的完整历史。初始标签由图片内容预填，可随时修改。</p><div id="grid" class="grid"></div><div id="empty" hidden><h3>这里还没有穿搭</h3><p>调整筛选条件，或添加一张新的灵感图。</p></div></section></main>
<dialog id="detail"><div class="dialogbar"><span>OUTFIT NOTES / 穿搭档案</span><button class="close" aria-label="关闭">✕</button></div><div class="detailbody"><div class="viewer"><div class="tabs"><button id="viewGenerated" class="active">搭配拆解</button><button id="viewOriginal">参考原图</button><button id="zoom">⤢ 放大图片</button></div><img id="detailImage" alt="穿搭图片"><p id="imageHint"></p></div><form id="editor"><label>穿搭名称<input name="title" required></label><label>管理文件夹<select name="folder"></select></label><div id="tagEditor"></div><label>优先级<select name="priority"></select></label><label>我喜欢它的原因<textarea name="notes" rows="3" placeholder="例如：领口松弛、配色适合我；哪些细节需要回原图确认…"></textarea></label><div class="twocol"><label>我已有的单品<textarea name="owned" rows="2" placeholder="先从衣橱里找相似款"></textarea></label><label>考虑添置的单品<textarea name="wanted" rows="2" placeholder="款式、版型、材质要求"></textarea></label></div><label>预算<input name="price" placeholder="例如：衬衫预算300元"></label><label>试穿记录<textarea name="tryOnNotes" rows="3" placeholder="记录试穿日期、尺码、上身感受和需要调整的地方…"></textarea></label><div class="tryon-attachments"><label>试穿图片<input id="tryOnFiles" type="file" accept="image/*" multiple></label><small id="tryOnUploadHint">可添加多张图片，点击缩略图放大；保存修改后保留。</small><div id="tryOnGallery" class="tryon-gallery"></div></div><div class="editorfooter"><button type="button" id="delete" class="danger">移除此条</button><button class="primary" type="submit">保存修改</button></div></form></div></dialog>
<dialog id="addDialog"><div class="dialogbar"><span>添加新的灵感</span><button class="close" aria-label="关闭">✕</button></div><form id="addForm"><label>穿搭名称<input name="title" required placeholder="给这套穿搭起个名字"></label><label>展示图片<input name="photo" type="file" accept="image/*" required></label><label>参考原图（可选）<input name="ref" type="file" accept="image/*"></label><label>归入文件夹<select name="folder"></select></label><button class="primary">添加到灵感库</button></form></dialog>
<dialog id="lightbox"><button class="close" aria-label="关闭">✕</button><img alt="放大的穿搭图片"></dialog><input type="file" accept="application/json" id="importFile" hidden><div id="toast" role="status"></div><script src="app.js?v=20261105-tryon"></script></body></html>
